<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>낭떠러지 줄다리기</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <!-- 상단 헤더 (가로 한 줄) -->
    <header class="game-header">
      <h1 class="title">⚡ 낭떠러지 줄다리기</h1>
      <div class="stats">
        <span class="pill" id="territory-score">🔴5 : 5🔵</span>
        <span class="pill">R<b id="round-num">1</b></span>
        <span class="pill" id="win-record">0승 0패</span>
        <button id="btn-sound-toggle" class="icon-btn" title="소리">🔊</button>
        <button id="btn-rules-open" class="icon-btn" title="규칙">❓</button>
        <button id="btn-reset-game" class="icon-btn" title="리셋">🔄</button>
      </div>
    </header>

    <!-- 영토 무대 (깃발 없음) -->
    <section class="stage">
      <div class="cliff cliff-left">💀</div>
      <div class="track">
        <div class="tiles" id="tiles-container"></div>
        <div class="chars">
          <div class="char" id="player-unit">🤠</div>
          <div class="char" id="ai-unit">🤖</div>
        </div>
      </div>
      <div class="cliff cliff-right">💀</div>
    </section>

    <!-- 타이머 (결정 시간에만 표시) -->
    <div class="timer" id="timer-wrap">
      <div class="timer-bar"><div class="timer-fill" id="timer-bar-fill"></div></div>
      <span class="timer-sec" id="timer-seconds">20</span>
    </div>

    <!-- 가위바위보 대형 화면 -->
    <main class="arena">
      <div class="fighter player" id="player-fighter-zone">
        <div class="f-head"><span>🤠 나</span><span class="power-chip" id="player-power-tag">약파워</span></div>
        <div class="hand" id="player-hand-symbol">✊</div>
      </div>

      <div class="vs">VS</div>

      <div class="fighter ai" id="ai-fighter-zone">
        <div class="f-head"><span class="power-chip" id="ai-power-tag">?</span><span>상대 🤖</span></div>
        <div class="hand" id="ai-hand-symbol">✌️</div>
      </div>

      <!-- 결과 오버레이 -->
      <div class="result-overlay hidden" id="result-overlay">
        <div class="result-text" id="result-text">이겼다!</div>
        <div class="result-sub" id="result-sub">+3칸</div>
      </div>
    </main>

    <!-- 하단 조작부 -->
    <footer class="controls">
      <button id="btn-start-game" class="start-btn">🔥 게임 시작</button>

      <div class="decision hidden" id="decision-panel">
        <div class="row-label">1단계 파워결정</div>
        <div class="power-row">
          <button class="power-btn selected" data-bet="1">약파워<small>1칸</small></button>
          <button class="power-btn" data-bet="2">중파워<small>2칸</small></button>
          <button class="power-btn" data-bet="3">강파워<small>3칸</small></button>
        </div>
        <div class="row-label">2단계 가위바위보 결정</div>
        <div class="rps-row">
          <button class="rps-btn" data-hand="scissors">✌️ 가위</button>
          <button class="rps-btn" data-hand="rock">✊ 바위</button>
          <button class="rps-btn" data-hand="paper">🖐️ 보</button>
        </div>
      </div>
    </footer>

    <!-- 게임 오버 모달 -->
    <div id="gameover-modal" class="modal hidden">
      <div class="modal-card">
        <div id="modal-trophy" class="trophy">🏆</div>
        <h2 id="modal-title">최종 승리!</h2>
        <p id="modal-desc"></p>
        <button id="btn-play-again" class="start-btn">다시 하기</button>
      </div>
    </div>

    <!-- 룰 모달 -->
    <div id="rules-modal" class="modal hidden">
      <div class="modal-card rules">
        <h2>📜 규칙</h2>
        <p>• 상대를 5칸 밀어 절벽으로 떨어뜨리면 승리</p>
        <p>• 이기면 내가 고른 파워만큼 전진</p>
        <p>• 비기면 낮은 파워를 낸 쪽이 <b>차이만큼</b> 전진 (후딜레이 카운터)</p>
        <p>• 결정 시간 20초, 결과 10초 후 자동 진행</p>
        <button id="btn-close-rules" class="start-btn">닫기</button>
      </div>
    </div>
  </div>

  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
